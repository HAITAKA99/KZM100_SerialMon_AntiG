<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かざみんシリーズソフトウェア</title>
  <link rel="icon" type="image/svg+xml" href="./latest/icons/kazamin.svg">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333333;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: #1a202c;
    }
    .lead {
      color: #4a5568;
      margin-top: 0;
      margin-bottom: 1.75rem;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #2d3748;
    }
    ul.version-list {
      list-style: none;
      padding: 0;
      margin: 0 0 2rem 0;
    }
    ul.version-list li {
      margin: 8px 0;
      font-size: 1rem;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .badge-latest {
      display: inline-block;
      background: #28a745;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
      line-height: 1.2;
    }
    .readme-link {
      margin-left: 4px;
    }
    .footer-links {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <h1>かざみんシリーズソフトウェア</h1>
  <p class="lead">こちらより、かざみんシリーズのソフトウェアをご利用いただけます。</p>

  <h2>かざみんリアルタイムモニター(KZM100A/KZM100LR)</h2>
  <ul id="version-list" class="version-list">
    <li><a href="./ver.0.1.7/">ver.0.1.7</a> <span class="readme-link">(<a href="https://github.com/HAITAKA99/kazamin/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a>)</span> <span class="badge-latest">最新</span></li>
    <li><a href="./ver.0.1.6/">ver.0.1.6</a></li>
    <li><a href="./ver.0.1.5/">ver.0.1.5</a></li>
    <li><a href="./ver.0.1.3/">ver.0.1.3</a></li>
    <li><a href="./ver.0.1.2/">ver.0.1.2</a></li>
    <li><a href="./ver.0.1.1/">ver.0.1.1</a></li>
    <li><a href="./ver.0.1.0/">ver.0.1.0</a></li>
  </ul>

  <div class="footer-links">
    <p><a href="https://kazamin.jp/" target="_blank" rel="noopener noreferrer">kazamin.jp へのリンク</a></p>
  </div>

  <script>
    (async function() {
      const repo = 'HAITAKA99/kazamin';
      const listEl = document.getElementById('version-list');

      async function checkReadme(tagName, isLatest) {
        try {
          const res = await fetch(`https://raw.githubusercontent.com/${repo}/${tagName}/README.md`, { method: 'HEAD' });
          if (res.ok) return `https://github.com/${repo}/blob/${tagName}/README.md`;
        } catch (e) {}

        if (isLatest) {
          try {
            const resMain = await fetch(`https://raw.githubusercontent.com/${repo}/main/README.md`, { method: 'HEAD' });
            if (resMain.ok) return `https://github.com/${repo}/blob/main/README.md`;
          } catch (e) {}
        }

        try {
          const resLocal = await fetch(`./${tagName}/README.md`, { method: 'HEAD' });
          if (resLocal.ok) return `./${tagName}/README.md`;
        } catch (e) {}

        return null;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/tags`);
        if (!res.ok) return;
        const tags = await res.json();
        if (!Array.isArray(tags) || tags.length === 0) return;

        listEl.innerHTML = '';
        for (let i = 0; i < tags.length; i++) {
          const tag = tags[i];
          const isLatest = (i === 0);
          const li = document.createElement('li');

          const verLink = document.createElement('a');
          verLink.href = `./${tag.name}/`;
          verLink.textContent = tag.name;
          li.appendChild(verLink);

          const readmeUrl = await checkReadme(tag.name, isLatest);
          if (readmeUrl) {
            li.appendChild(document.createTextNode(' '));
            const readmeSpan = document.createElement('span');
            readmeSpan.className = 'readme-link';
            readmeSpan.innerHTML = `(<a href="${readmeUrl}" target="_blank" rel="noopener noreferrer">README</a>)`;
            li.appendChild(readmeSpan);
          }

          if (isLatest) {
            const badge = document.createElement('span');
            badge.className = 'badge-latest';
            badge.textContent = '最新';
            li.appendChild(document.createTextNode(' '));
            li.appendChild(badge);
          }

          listEl.appendChild(li);
        }
      } catch (err) {}
    })();
  </script>
</body>
</html>
