/**
 * main.css
 * かざみんリアルタイムモニター (Web Serial Monitor) スタイルシート
 */

:root {
  --bg-primary: #0b1329;
  --bg-card: #131f3d;
  --bg-card-hover: #19294f;
  --bg-input: #1a294c;
  --border-color: #243660;
  --border-light: #334d85;

  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  --accent-cyan: #00f0ff;
  --accent-blue: #38bdf8;
  --accent-green: #22c55e;
  --accent-yellow: #eab308;
  --accent-red: #ef4444;

  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-family);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* アプリケーション全体コンテナ */
.app-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 8px 16px;
  gap: 8px;
  box-sizing: border-box;
}

/* ヘッダーエリア */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 8px 18px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  flex-shrink: 0;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-logo {
  width: 32px;
  height: 32px;
  display: block;
  flex-shrink: 0;
}

.header-title {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-version {
  font-size: 0.8rem;
  padding: 2px 8px;
  background-color: rgba(0, 240, 255, 0.15);
  color: var(--accent-cyan);
  border: 1px solid rgba(0, 240, 255, 0.4);
  border-radius: 9999px;
  font-weight: 600;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* デジタル時計 */
.digital-clock-widget {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  background-color: rgba(11, 19, 41, 0.8);
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
}

.clock-date {
  font-size: 0.72rem;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}

.clock-time {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-cyan);
  font-family: var(--font-mono);
  letter-spacing: 1px;
}

/* 接続ボタン & デモモード */
.serial-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  padding: 8px 16px;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, #0284c7, #00f0ff);
  color: #0b1329;
  box-shadow: 0 2px 8px rgba(0, 240, 255, 0.3);
}

.btn-primary:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.btn-danger {
  background: linear-gradient(135deg, #dc2626, #ef4444);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
}

.btn-danger:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.btn-secondary {
  background-color: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
}

.btn-secondary:hover {
  background-color: var(--bg-card-hover);
  border-color: var(--accent-cyan);
}

.btn-demo {
  background-color: rgba(234, 179, 8, 0.15);
  color: var(--accent-yellow);
  border: 1px solid rgba(234, 179, 8, 0.4);
}

.btn-demo.active {
  background: linear-gradient(135deg, #ca8a04, #eab308);
  color: #0b1329;
  font-weight: 700;
}

.connection-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: var(--text-muted);
  display: inline-block;
  margin-right: 4px;
}

.connection-status-dot.connected {
  background-color: var(--accent-green);
  box-shadow: 0 0 8px var(--accent-green);
}

.connection-status-dot.demo {
  background-color: var(--accent-yellow);
  box-shadow: 0 0 8px var(--accent-yellow);
}

/* メインコンテンツレイアウト */
.app-main {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-height: 0;
}

/* 上段: 3連メーターパネル */
.gauges-section {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  align-items: stretch;
  flex: 1.25;
  min-height: 280px;
}

#gauge-dir-container,
#gauge-speed-container,
#gauge-temp-container {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.gauge-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  height: 100%;
  flex: 1;
  min-height: 280px;
  position: relative;
  overflow: hidden;
}

.gauge-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  min-height: 20px;
  flex-shrink: 0;
}

.gauge-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.8px;
}

.gauge-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background-color: var(--accent-red);
  color: #ffffff;
  animation: pulse-badge 1s infinite alternate;
}

@keyframes pulse-badge {
  from { opacity: 0.7; }
  to { opacity: 1; transform: scale(1.05); }
}

.gauge-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 180px;
  max-height: 220px;
}

.gauge-footer {
  margin-top: 4px;
  text-align: center;
  min-height: 42px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.gauge-value-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
}

.value-number {
  font-size: 1.85rem;
  font-weight: 800;
  font-family: var(--font-mono);
  color: #ffffff;
  letter-spacing: 1px;
}

.value-number.error-text {
  color: var(--accent-red);
  animation: pulse-badge 0.8s infinite alternate;
}

.value-unit {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.value-sub {
  font-size: 0.85rem;
  color: var(--accent-cyan);
  margin-left: 8px;
  font-weight: 600;
}

/* コンパス SVG */
.compass-svg {
  height: 100%;
  min-height: 180px;
  max-height: 200px;
  width: auto;
  max-width: 100%;
}

.compass-outer-ring {
  fill: none;
  stroke: var(--border-color);
  stroke-width: 2;
}

.compass-inner-ring {
  fill: rgba(11, 19, 41, 0.6);
  stroke: var(--border-light);
  stroke-width: 1;
}

.compass-label {
  fill: var(--text-secondary);
  text-anchor: middle;
  dominant-baseline: central;
  font-weight: 700;
}

.compass-label.major-label {
  font-size: 16px;
  fill: #ffffff;
}

.compass-label.label-n {
  fill: var(--accent-red);
}

.compass-label.minor-label {
  font-size: 11px;
  fill: var(--text-muted);
}

.compass-deg-label {
  font-size: 9px;
  fill: var(--text-muted);
  text-anchor: middle;
  font-family: var(--font-mono);
}

/* スピードメーター SVG */
.speed-svg {
  height: 100%;
  min-height: 180px;
  max-height: 200px;
  width: auto;
  max-width: 100%;
}

.speed-arc-track {
  fill: none;
  stroke: #1e293b;
  stroke-width: 18;
  stroke-linecap: round;
}

.speed-arc-fill {
  fill: none;
  stroke-width: 18;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.4s ease;
}

.speed-arc-mask {
  fill: none;
  stroke: #ffffff;
  stroke-width: 18;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.speed-arc-seg {
  fill: none;
  stroke-width: 18;
  stroke-linecap: butt;
}

.speed-arc-error {
  fill: none;
  stroke-width: 18;
  stroke-linecap: round;
}

.speed-tick-text {
  font-size: 11.5px;
  font-weight: 600;
  fill: var(--text-secondary);
  font-family: var(--font-mono);
}

.speed-scale-indicator {
  font-size: 11px;
  font-weight: 600;
  fill: var(--text-muted);
  text-anchor: middle;
  font-family: var(--font-mono);
}

/* 温度計 SVG・スタイル */
.temp-svg {
  height: 100%;
  min-height: 180px;
  max-height: 200px;
  width: auto;
  max-width: 100%;
}

.temp-arc-track {
  fill: none;
  stroke: #1e293b;
  stroke-width: 18;
  stroke-linecap: round;
}

.temp-arc-mask {
  fill: none;
  stroke: #ffffff;
  stroke-width: 18;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.temp-arc-seg {
  fill: none;
  stroke-width: 18;
  stroke-linecap: butt;
}

.temp-tick-text {
  font-size: 11.5px;
  font-weight: 600;
  fill: var(--text-secondary);
  font-family: var(--font-mono);
}

.temp-scale-indicator {
  font-size: 11px;
  font-weight: 600;
  fill: var(--text-muted);
  text-anchor: middle;
  font-family: var(--font-mono);
}

.temp-highlight-mark text {
  font-family: var(--font-mono);
  letter-spacing: -0.5px;
}

/* 中段: 時間軸グラフパネル */
.chart-section {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 10px 10px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  flex: 1.35;
  min-height: 0;
}

.chart-panel {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.chart-controls-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.control-label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 600;
}

.btn-group {
  display: inline-flex;
  background-color: var(--bg-primary);
  border-radius: var(--radius-sm);
  padding: 2px;
  border: 1px solid var(--border-color);
}

.btn-scale {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 3px 8px;
  font-size: 0.78rem;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-scale:hover {
  color: var(--text-primary);
}

.btn-scale.active {
  background-color: #1e3a8a;
  color: var(--accent-cyan);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}

.chart-canvas-wrapper {
  width: 100%;
  position: relative;
  flex: 1;
  min-height: 160px;
  height: auto;
}

#time-series-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* 下段: 受信コンソール & CSV出力 */
.bottom-section {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

#console-container {
  display: flex;
  flex-direction: column;
  flex: 1;
  height: 100%;
  min-height: 0;
}

.console-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 8px 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.console-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  flex-wrap: wrap;
  gap: 8px;
  flex-shrink: 0;
}

.console-title-area {
  display: flex;
  align-items: center;
  gap: 10px;
}

.console-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.8px;
}

.console-count-badge {
  font-size: 0.75rem;
  background-color: rgba(255, 255, 255, 0.08);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.console-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.auto-scroll-label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.btn-clear-console {
  background: none;
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 2px 6px;
  font-size: 0.75rem;
  border-radius: 4px;
  cursor: pointer;
}

.btn-clear-console:hover {
  color: var(--text-primary);
  border-color: var(--border-light);
}

.console-table-header {
  display: grid;
  grid-template-columns: 180px 100px 90px 90px 70px 1fr;
  padding: 4px 12px;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-bottom: none;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  font-family: var(--font-mono);
  flex-shrink: 0;
}

.console-body {
  flex: 1;
  min-height: 65px;
  height: auto;
  overflow-y: auto;
  background-color: #070d1d;
  border: 1px solid var(--border-color);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  padding: 2px 0;
  font-family: var(--font-mono);
  font-size: 0.82rem;
}

.console-placeholder {
  color: var(--text-muted);
  padding: 20px;
  text-align: center;
  font-size: 0.85rem;
}

.console-row {
  display: grid;
  grid-template-columns: 180px 100px 90px 90px 70px 1fr;
  padding: 3px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  align-items: center;
  transition: background-color 0.1s ease;
}

.console-row:hover {
  background-color: rgba(255, 255, 255, 0.04);
}

.console-row.row-error {
  background-color: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
}

.col-speed.val-error {
  color: var(--accent-red);
  font-weight: 700;
}

.badge-ok {
  color: var(--accent-green);
  font-weight: 700;
}

.badge-err {
  color: var(--accent-red);
  font-weight: 700;
}

.col-raw {
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* フッターエリア */
.app-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 16px;
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  margin-top: 0;
  flex-shrink: 0;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.footer-link {
  color: var(--accent-blue);
  text-decoration: none;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}

.footer-link:hover {
  color: var(--accent-cyan);
  text-decoration: underline;
}

.footer-logo {
  width: 24px;
  height: 24px;
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-csv {
  background: linear-gradient(135deg, #10b981, #059669);
  color: #ffffff;
  padding: 8px 16px;
  font-size: 0.85rem;
}

.btn-csv:hover {
  filter: brightness(1.1);
}

/* 16:9 大画面およびデスクトップ表示（全画面表示最適化） */
@media (min-width: 901px) and (min-height: 800px) {
  body {
    height: 100vh;
    overflow: hidden;
  }
  .app-container {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }
}

/* タブレット・中画面対応 */
@media (max-width: 900px) {
  body {
    overflow-y: auto;
  }
  .app-container {
    height: auto;
    min-height: 100vh;
    padding: 10px 12px;
    gap: 12px;
  }
  .gauges-section {
    grid-template-columns: 1fr;
    flex: none;
  }
  .gauge-card {
    min-height: 280px;
  }
  .gauge-body {
    min-height: 180px;
    max-height: 220px;
  }
  .compass-svg, .speed-svg, .temp-svg {
    max-height: 200px;
  }
  .chart-section {
    flex: none;
    height: auto;
  }
  .chart-canvas-wrapper {
    height: 360px;
    min-height: 360px;
  }
  #time-series-canvas {
    position: relative;
    height: 360px;
  }
  .bottom-section {
    flex: none;
    height: auto;
  }
  .console-body {
    height: 180px;
    flex: none;
  }
}

/* スマホ対応 */
@media (max-width: 680px) {
  .app-header {
    flex-direction: column;
    align-items: flex-start;
  }
  .header-controls {
    width: 100%;
    justify-content: space-between;
  }
  .chart-canvas-wrapper {
    height: 320px;
    min-height: 320px;
  }
  #time-series-canvas {
    height: 320px;
  }
  .console-table-header, .console-row {
    grid-template-columns: 120px 70px 60px 60px 50px 1fr;
    font-size: 0.72rem;
  }
  .app-footer {
    flex-direction: column;
    align-items: flex-start;
  }
}

/* 画面高さが小さい場合のスクロール許可 */
@media (max-height: 799px) and (min-width: 901px) {
  body {
    overflow-y: auto;
  }
  .app-container {
    height: auto;
    min-height: 100vh;
  }
  .gauge-card {
    min-height: 280px;
  }
  .chart-canvas-wrapper {
    min-height: 240px;
    height: 240px;
  }
  #time-series-canvas {
    position: relative;
    height: 240px;
  }
  .console-body {
    min-height: 120px;
    height: 120px;
  }
}

/**
 * packet-parser.js
 * かざみん(KZM100A/KZM100LR)のシリアル通信パケット解析モジュール
 *
 * 受信仕様:
 * - ボーレート: 9600bps
 * - フォーマット: 00.0[m/s],000,+00.0[CR/LF]
 *   - 風速: 00.0 ～ 99.9 [m/s] (99.9は計測エラー)
 *   - 風向: 000 ～ 359 [度]
 *   - 気温: -20.0 ～ +65.0 [℃]
 */

// パケットの正規表現: 固定桁数を基本としつつ、前後の空白や桁数のわずかな差異にも柔軟に対応
// 例: "12.3[m/s],045,+23.5\r\n" や "00.0[m/s],000,-05.2"
const PACKET_REGEX = /^\s*(\d{1,2}\.\d)\[m\/s\],\s*(\d{1,3}),\s*([+-]?\d{1,2}\.\d)\s*$/;

/**
 * 1行のテキストをパースして構造化データを返す
 * @param {string} line - 受信した1行文字列
 * @param {Date} [timestamp=new Date()] - 受信日時
 * @returns {object|null} パース結果。不正パケットの場合はnull
 */
function parsePacket(line, timestamp = new Date()) {
  if (typeof line !== 'string') return null;

  const trimmed = line.trim();
  if (!trimmed) return null;

  const match = trimmed.match(PACKET_REGEX);
  if (!match) {
    return {
      isValid: false,
      raw: trimmed,
      timestamp,
      errorReason: 'FORMAT_MISMATCH'
    };
  }

  const speedStr = match[1];
  const dirStr = match[2];
  const tempStr = match[3];

  const speed = parseFloat(speedStr);
  const direction = parseInt(dirStr, 10);
  const temperature = parseFloat(tempStr);

  // 風速 99.9 [m/s] は計測エラー
  const isError = Math.abs(speed - 99.9) < 0.05;

  // 範囲チェック
  // 風速: 0.0 〜 99.9
  // 風向: 0 〜 359
  // 気温: -20.0 〜 +65.0
  const isDirValid = direction >= 0 && direction <= 359;
  const isTempValid = temperature >= -20.0 && temperature <= 65.0;
  const isSpeedValid = speed >= 0.0 && speed <= 99.9;

  if (!isDirValid || !isTempValid || !isSpeedValid) {
    return {
      isValid: false,
      raw: trimmed,
      timestamp,
      errorReason: 'OUT_OF_RANGE'
    };
  }

  return {
    isValid: true,
    raw: trimmed,
    timestamp,
    speed,
    speedStr,
    direction,
    dirStr,
    temperature,
    tempStr,
    isError
  };
}

/**
 * ring-buffer.js
 * メモリ割り当てを抑え長期連続稼働に適した固定長リングバッファ
 */

class RingBuffer {
  /**
   * @param {number} capacity - バッファの最大容量
   */
  constructor(capacity = 600) {
    this.capacity = capacity;
    this.buffer = new Array(capacity);
    this.head = 0; // 次に書き込むインデックス
    this.size = 0; // 現在格納されている要素数
  }

  /**
   * 要素を末尾に追加
   * @param {*} item
   */
  push(item) {
    this.buffer[this.head] = item;
    this.head = (this.head + 1) % this.capacity;
    if (this.size < this.capacity) {
      this.size++;
    }
  }

  /**
   * 現在の要素数を返す
   * @returns {number}
   */
  get length() {
    return this.size;
  }

  /**
   * 最も古い要素から最新の要素までの配列を生成して返す
   * （最新の要素が末尾）
   * @returns {Array}
   */
  toArray() {
    const result = new Array(this.size);
    if (this.size < this.capacity) {
      for (let i = 0; i < this.size; i++) {
        result[i] = this.buffer[i];
      }
    } else {
      // head は最も古い要素を指している
      for (let i = 0; i < this.size; i++) {
        const index = (this.head + i) % this.capacity;
        result[i] = this.buffer[index];
      }
    }
    return result;
  }

  /**
   * 最新の要素を取得
   * @returns {*}
   */
  latest() {
    if (this.size === 0) return null;
    const index = (this.head - 1 + this.capacity) % this.capacity;
    return this.buffer[index];
  }

  /**
   * バッファをクリア
   */
  clear() {
    this.head = 0;
    this.size = 0;
    this.buffer.fill(undefined);
  }
}

/**
 * aggregator.js
 * 時間軸グラフ用のデータ集約・ダウンサンプリングエンジン
 *
 * グラフ仕様:
 * - プロット点数は 600点 固定
 * - スケール:
 *   - 10m: 10分 (600秒) -> 1秒間隔 (Δt = 1)
 *   - 1h:  1時間 (3600秒) -> 6秒間隔 (Δt = 6)
 *   - 6h:  6時間 (21600秒) -> 36秒間隔 (Δt = 36)
 *   - 24h: 24時間 (86400秒) -> 144秒間隔 (Δt = 144)
 *   - 7d:  7日間 (604800秒) -> 1008秒間隔 (Δt = 1008)
 * - 600点に満たない左側の未到達部分は null
 * - 右端（インデックス599）は常に1秒ごとの最新データ
 * - Δt秒ごとにスクロールし、直近Δt秒間の平均値がインデックス598へ確定される
 * - 平均化ルール:
 *   - 風速・気温: 算術平均（計測エラー時は風速・風向を除外）
 *   - 風向: ベクトル平均（atan2(sum(sin), sum(cos))）
 */

const TIME_SCALES = {
  '10m': { label: '10分間', durationSec: 600, intervalSec: 1 },
  '1h':  { label: '1時間',  durationSec: 3600, intervalSec: 6 },
  '6h':  { label: '6時間',  durationSec: 21600, intervalSec: 36 },
  '24h': { label: '24時間', durationSec: 86400, intervalSec: 144 },
  '7d':  { label: '7日間',  durationSec: 604800, intervalSec: 1008 }
};

const PLOT_COUNT = 600;

/**
 * 角度配列のベクトル平均を計算する
 * @param {number[]} angles - 有効な角度(0-359)の配列
 * @returns {number|null} 0〜359の平均角度。データが空の場合はnull
 */
function calculateVectorMeanDirection(angles) {
  if (!angles || angles.length === 0) return null;

  let sumSin = 0;
  let sumCos = 0;

  for (const deg of angles) {
    const rad = (deg * Math.PI) / 180;
    sumSin += Math.sin(rad);
    sumCos += Math.cos(rad);
  }

  // ベクトルの長さがほぼ0の場合は直前の値またはnull
  if (Math.abs(sumSin) < 1e-7 && Math.abs(sumCos) < 1e-7) {
    return angles[0];
  }

  let meanRad = Math.atan2(sumSin, sumCos);
  let meanDeg = (meanRad * 180) / Math.PI;
  if (meanDeg < 0) meanDeg += 360;

  return Math.round(meanDeg) % 360;
}

/**
 * パケットの配列から平均プロット点({ speed, direction, temperature, isError, timestamp })を計算
 * @param {Array} packets
 * @returns {object|null}
 */
function calculateAveragePoint(packets) {
  if (!packets || packets.length === 0) return null;

  const validSpeeds = [];
  const validDirs = [];
  const temps = [];

  let lastTimestamp = packets[packets.length - 1].timestamp;

  for (const p of packets) {
    if (!p.isValid) continue;

    temps.push(p.temperature);

    if (!p.isError) {
      validSpeeds.push(p.speed);
      validDirs.push(p.direction);
    }
  }

  if (temps.length === 0) return null;

  // 気温の算術平均
  const avgTemp = temps.reduce((a, b) => a + b, 0) / temps.length;

  // 風速の算術平均、最大値、最小値、中央値（全件エラーの場合は null または 99.9）
  let avgSpeed = null;
  let minSpeed = null;
  let maxSpeed = null;
  let medianSpeed = null;
  let avgDir = null;
  let isError = false;

  if (validSpeeds.length > 0) {
    avgSpeed = validSpeeds.reduce((a, b) => a + b, 0) / validSpeeds.length;
    minSpeed = Math.min(...validSpeeds);
    maxSpeed = Math.max(...validSpeeds);

    const sortedSpeeds = [...validSpeeds].sort((a, b) => a - b);
    const mid = Math.floor(sortedSpeeds.length / 2);
    if (sortedSpeeds.length % 2 === 1) {
      medianSpeed = sortedSpeeds[mid];
    } else {
      medianSpeed = (sortedSpeeds[mid - 1] + sortedSpeeds[mid]) / 2;
    }

    avgDir = calculateVectorMeanDirection(validDirs);
  } else {
    isError = true;
    avgSpeed = 99.9;
    minSpeed = 99.9;
    maxSpeed = 99.9;
    medianSpeed = 99.9;
    avgDir = null;
  }

  return {
    timestamp: lastTimestamp,
    speed: avgSpeed !== null ? parseFloat(avgSpeed.toFixed(1)) : null,
    speedMin: minSpeed !== null ? parseFloat(minSpeed.toFixed(1)) : null,
    speedMax: maxSpeed !== null ? parseFloat(maxSpeed.toFixed(1)) : null,
    speedMedian: medianSpeed !== null ? parseFloat(medianSpeed.toFixed(1)) : null,
    direction: avgDir,
    temperature: parseFloat(avgTemp.toFixed(1)),
    isError
  };
}

class ChartAggregator {
  constructor(timeScaleKey = '10m') {
    this.timeScaleKey = timeScaleKey;
    this.config = TIME_SCALES[timeScaleKey] || TIME_SCALES['10m'];

    // 確定済みプロット配列 (スロット数 599点固定、インデックス 0〜598)
    // 左端(0)が最も古いスロット、右側(598)が最新確定スロット
    this.committedPoints = new Array(PLOT_COUNT - 1).fill(null);

    // 現在のインターバル期間内に受信した一時パケット群
    this.currentIntervalPackets = [];

    // 最新の未平均化リアルタイム生パケット（右端用、インデックス599）
    this.latestPacket = null;

    // リアルタイム集約用の直前バケットID
    this.lastBucketId = null;
  }

  /**
   * 時間スケールを変更
   * @param {string} newScaleKey ('10m', '1h', '6h', '24h', '7d')
   * @param {Array} historyPackets - スケール再構築用の過去全パケット配列（あれば）
   */
  setScale(newScaleKey, historyPackets = []) {
    if (!TIME_SCALES[newScaleKey]) return;
    this.timeScaleKey = newScaleKey;
    this.config = TIME_SCALES[newScaleKey];

    // 過去履歴パケットから再構築
    this.rebuildFromHistory(historyPackets);
  }

  /**
   * 1秒ごとに新しいパケットを追加
   * @param {object} packet - parsePacket の結果
   */
  addPacket(packet) {
    if (!packet || !packet.isValid) return;

    const intervalSec = this.config.intervalSec;
    const intervalMs = intervalSec * 1000;
    const pTime = packet.timestamp instanceof Date ? packet.timestamp.getTime() : new Date(packet.timestamp).getTime();
    const bucketId = Math.floor(pTime / intervalMs);

    this.latestPacket = packet;

    if (this.lastBucketId === null) {
      this.lastBucketId = bucketId;
      this.currentIntervalPackets = [packet];
      return;
    }

    if (bucketId === this.lastBucketId) {
      // 同一インターバル内: パケットを追加
      this.currentIntervalPackets.push(packet);
    } else if (bucketId > this.lastBucketId) {
      // インターバルが進んだ: 前のインターバルの平均値を確定点としてスロットへ追加
      const avgPoint = calculateAveragePoint(this.currentIntervalPackets);
      this.committedPoints.shift();
      this.committedPoints.push(avgPoint);

      // 通信途絶等で複数バケット進んだ場合は未計測スロットを null で埋める
      const missedBuckets = bucketId - this.lastBucketId - 1;
      const skipCount = Math.min(missedBuckets, PLOT_COUNT - 1);
      for (let i = 0; i < skipCount; i++) {
        this.committedPoints.shift();
        this.committedPoints.push(null);
      }

      this.lastBucketId = bucketId;
      this.currentIntervalPackets = [packet];
    }
  }

  /**
   * グラフ描画用の 600点 固定配列を取得する
   * - インデックス 0〜598: 過去の確定平均データ（足りない左側や未計測期間は null）
   * - インデックス 599: 最新の1秒生パケット
   * @returns {Array<object|null>} 長さ600の配列
   */
  getPlotData() {
    const result = new Array(PLOT_COUNT).fill(null);

    // 最新パケット（右端 インデックス 599）
    if (this.latestPacket) {
      const sp = this.latestPacket.speed;
      result[PLOT_COUNT - 1] = {
        timestamp: this.latestPacket.timestamp,
        speed: sp,
        speedMin: sp,
        speedMax: sp,
        speedMedian: sp,
        direction: this.latestPacket.direction,
        temperature: this.latestPacket.temperature,
        isError: this.latestPacket.isError
      };
    }

    // 確定済みポイント (インデックス 0〜598)
    for (let i = 0; i < PLOT_COUNT - 1; i++) {
      result[i] = this.committedPoints[i];
    }

    return result;
  }

  /**
   * 過去ログから確定ポイントを再集計・再構築する（スケール変更時など）
   * タイムバケット（絶対時刻の時間窓）に基づき、空白期間は正しく null スロットとして配置する
   * @param {Array} packets - 時系列順の生パケット配列
   */
  rebuildFromHistory(packets) {
    this.committedPoints = new Array(PLOT_COUNT - 1).fill(null);
    this.currentIntervalPackets = [];
    this.latestPacket = null;
    this.lastBucketId = null;

    if (!packets || packets.length === 0) return;

    const validPackets = packets.filter((p) => p && p.isValid);
    if (validPackets.length === 0) return;

    validPackets.sort((a, b) => {
      const ta = a.timestamp instanceof Date ? a.timestamp.getTime() : new Date(a.timestamp).getTime();
      const tb = b.timestamp instanceof Date ? b.timestamp.getTime() : new Date(b.timestamp).getTime();
      return ta - tb;
    });

    const latest = validPackets[validPackets.length - 1];
    this.latestPacket = latest;

    const intervalSec = this.config.intervalSec;
    const intervalMs = intervalSec * 1000;
    const latestMs = latest.timestamp instanceof Date ? latest.timestamp.getTime() : new Date(latest.timestamp).getTime();
    const latestBucket = Math.floor(latestMs / intervalMs);
    this.lastBucketId = latestBucket;

    // バケットIDごとにパケットをグループ化
    const bucketMap = new Map();
    for (const p of validPackets) {
      const pTime = p.timestamp instanceof Date ? p.timestamp.getTime() : new Date(p.timestamp).getTime();
      const bId = Math.floor(pTime / intervalMs);
      if (!bucketMap.has(bId)) {
        bucketMap.set(bId, []);
      }
      bucketMap.get(bId).push(p);
    }

    // 最新バケットは現在進行中のインターバル
    this.currentIntervalPackets = bucketMap.get(latestBucket) || [];

    // latestBucket より過去のバケットを各時間スロットにマッピング
    // diff = 1 (1つ前のバケット) => スロット 598
    // diff = 2 (2つ前のバケット) => スロット 597
    // ...
    // diff = k => スロット PLOT_COUNT - 1 - diff
    for (const [bId, bPackets] of bucketMap.entries()) {
      const diff = latestBucket - bId;
      if (diff > 0 && diff < PLOT_COUNT) {
        const slotIdx = PLOT_COUNT - 1 - diff;
        this.committedPoints[slotIdx] = calculateAveragePoint(bPackets);
      }
    }
  }
}

/**
 * db.js
 * IndexedDB を利用した測定データのローカル永続化（最大7日間保持 & 自動パージ）
 */

const DB_NAME = 'KazaminMonitorDB';
const DB_VERSION = 1;
const STORE_NAME = 'measurements';

class StorageManager {
  constructor() {
    this.db = null;
    this.initPromise = null;
  }

  /**
   * IndexedDBの初期化・オープン
   * @returns {Promise<IDBDatabase>}
   */
  async init() {
    if (this.db) return this.db;
    if (this.initPromise) return this.initPromise;

    this.initPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, {
            keyPath: 'id',
            autoIncrement: true
          });
          store.createIndex('timestamp', 'timestamp', { unique: false });
        }
      };

      request.onsuccess = (event) => {
        this.db = event.target.result;
        resolve(this.db);
      };

      request.onerror = (event) => {
        console.error('IndexedDB open error:', event.target.error);
        reject(event.target.error);
      };
    });

    return this.initPromise;
  }

  /**
   * 計測パケットを1件保存
   * @param {object} packet - parsePacket の結果
   */
  async savePacket(packet) {
    if (!packet || !packet.isValid) return;

    try {
      const db = await this.init();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);

      const record = {
        timestamp: packet.timestamp instanceof Date ? packet.timestamp.getTime() : packet.timestamp,
        speed: packet.speed,
        direction: packet.direction,
        temperature: packet.temperature,
        isError: packet.isError,
        raw: packet.raw
      };

      store.add(record);
    } catch (err) {
      console.warn('Failed to save packet to IndexedDB:', err);
    }
  }

  /**
   * 指定した開始時刻以降のデータを取得
   * @param {number|Date} startTime
   * @returns {Promise<Array>}
   */
  async getSince(startTime) {
    const startMs = startTime instanceof Date ? startTime.getTime() : startTime;
    const db = await this.init();

    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const index = store.index('timestamp');
      const range = IDBKeyRange.lowerBound(startMs);
      const request = index.getAll(range);

      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  /**
   * 保存されている全レコードを取得
   * @returns {Promise<Array>}
   */
  async getAll() {
    const db = await this.init();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const request = store.getAll();

      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  /**
   * 7日以上前の古いレコードを自動削除（パージ）
   * @param {number} [retentionDays=7] - 保持日数
   */
  async purgeOldData(retentionDays = 7) {
    try {
      const db = await this.init();
      const cutoffTime = Date.now() - retentionDays * 24 * 60 * 60 * 1000;

      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const index = store.index('timestamp');
      const range = IDBKeyRange.upperBound(cutoffTime);

      const request = index.openCursor(range);
      request.onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) {
          cursor.delete();
          cursor.continue();
        }
      };
    } catch (err) {
      console.warn('Failed to purge old data:', err);
    }
  }

  /**
   * 全データを削除（クリア）
   */
  async clear() {
    const db = await this.init();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }
}

/**
 * csv-exporter.js
 * 保持データ（最大7日間）をCSV形式でファイルダウンロードするモジュール
 */

/**
 * 日付オブジェクトを YYYY-MM-DD HH:mm:ss 形式にフォーマット
 * @param {Date|number} timestamp
 * @returns {string}
 */
function formatTimestamp(timestamp) {
  const d = timestamp instanceof Date ? timestamp : new Date(timestamp);
  const pad = (n) => String(n).padStart(2, '0');

  const yyyy = d.getFullYear();
  const mm = pad(d.getMonth() + 1);
  const dd = pad(d.getDate());
  const hh = pad(d.getHours());
  const min = pad(d.getMinutes());
  const ss = pad(d.getSeconds());

  return `${yyyy}/${mm}/${dd} ${hh}:${min}:${ss}`;
}

/**
 * データ配列からCSV文字列を生成してブラウザダウンロードを実行する
 * @param {Array<object>} records - 測定レコードの配列
 * @param {string} [filenamePrefix='kazamin_log']
 */
function exportToCsv(records, filenamePrefix = 'kazamin_log') {
  if (!records || records.length === 0) {
    alert('出力対象の受信データがありません。');
    return;
  }

  // BOM付き UTF-8 でExcelでも文字化けしないようにする
  const BOM = '\uFEFF';
  const headers = ['日時 (Timestamp)', '風速 (Wind Speed [m/s])', '風向 (Wind Direction [deg])', '気温 (Temperature [℃])', 'ステータス (Status)', '生パケット (Raw Data)'];
  
  const rows = [headers.join(',')];

  for (const r of records) {
    const timeStr = `"${formatTimestamp(r.timestamp)}"`;
    const speedStr = r.speed !== null && r.speed !== undefined ? r.speed.toFixed(1) : '';
    const dirStr = r.direction !== null && r.direction !== undefined ? r.direction : '';
    const tempStr = r.temperature !== null && r.temperature !== undefined ? (r.temperature >= 0 ? `+${r.temperature.toFixed(1)}` : r.temperature.toFixed(1)) : '';
    const statusStr = r.isError ? '"ERROR (99.9m/s)"' : '"OK"';
    const rawStr = r.raw ? `"${r.raw.replace(/"/g, '""')}"` : '';

    rows.push([timeStr, speedStr, dirStr, tempStr, statusStr, rawStr].join(','));
  }

  const csvContent = BOM + rows.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

  // ファイル名生成: kazamin_log_YYYYMMDD_HHMMSS.csv
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const fileDate = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const filename = `${filenamePrefix}_${fileDate}.csv`;

  // ダウンロードリンク作成
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', filename);
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
// --- End src\export\csv-exporter.js ---

/**
 * serial-manager.js
 * Web Serial API の接続・データ受信管理、およびデモモード（シミュレータ）
 */

class SerialManager {
  constructor() {
    this.port = null;
    this.reader = null;
    this.readableStreamClosed = null;
    this.isConnected = false;
    this.isDemoMode = false;
    this.demoTimer = null;

    // コールバック
    this.onPacketReceived = null;
    this.onStatusChange = null;
    this.onError = null;

    // デモ用内部状態
    this.demoState = {
      speed: 4.5,
      direction: 45,
      temperature: 22.5
    };
  }

  /**
   * ブラウザがWeb Serial APIをサポートしているか
   * @returns {boolean}
   */
  static isSupported() {
    return 'serial' in navigator;
  }

  /**
   * シリアルポートを選択して接続する
   */
  async connect() {
    if (this.isDemoMode) {
      this.stopDemo();
    }

    if (!SerialManager.isSupported()) {
      throw new Error('お使いのブラウザはWeb Serial APIに対応していません。Google ChromeまたはMicrosoft Edgeをご利用ください。');
    }

    // 以前のポートが開いたまま残っていれば安全に切断・解放
    if (this.port) {
      try {
        await this.disconnect();
      } catch (e) {
        console.warn('Pre-connect disconnect warning:', e);
      }
    }

    try {
      this._updateStatus('requesting');
      // ユーザーにシリアルポートを選択させる
      this.port = await navigator.serial.requestPort();

      // ボーレート 9600bps でポートを開く（bufferSizeはドライバデフォルトに任せる）
      await this.port.open({
        baudRate: 9600,
        dataBits: 8,
        stopBits: 1,
        parity: 'none'
      });

      this.isConnected = true;
      this._updateStatus('connected');

      // 受信ループ開始（非同期バックグラウンド実行）
      this._readLoop().catch((err) => {
        console.error('Unhandled read loop error:', err);
      });
    } catch (err) {
      this.isConnected = false;
      this.port = null;
      this._updateStatus('disconnected');
      if (err.name !== 'NotFoundError') { // ユーザーキャンセル以外のエラー
        if (this.onError) this.onError(err);
      }
      throw err;
    }
  }

  /**
   * シリアル接続を切断する
   */
  async disconnect() {
    if (this.isDemoMode) {
      this.stopDemo();
      return;
    }

    if (!this.isConnected && !this.port) {
      this._updateStatus('disconnected');
      return;
    }

    this.isConnected = false;

    try {
      if (this.reader) {
        try {
          await this.reader.cancel();
        } catch (e) {
          console.warn('Reader cancel warning:', e);
        }
        try {
          this.reader.releaseLock();
        } catch (e) {
          console.warn('Reader releaseLock warning:', e);
        }
        this.reader = null;
      }

      if (this.port) {
        try {
          await this.port.close();
        } catch (e) {
          console.warn('Port close warning:', e);
        }
        this.port = null;
      }
    } finally {
      this.reader = null;
      this.port = null;
      this._updateStatus('disconnected');
    }
  }

  /**
   * シリアルポートからの読み取りループ
   * pipeTo によるストリームロックを避け、素の TextDecoder と getReader で読み取りを行う
   * @private
   */
  async _readLoop() {
    const textDecoder = new TextDecoder();
    let buffer = '';

    while (this.port && this.port.readable && this.isConnected) {
      try {
        this.reader = this.port.readable.getReader();
      } catch (err) {
        console.error('Failed to get readable stream reader:', err);
        break;
      }

      try {
        while (this.isConnected) {
          const { value, done } = await this.reader.read();
          if (done) {
            // reader.cancel() が呼ばれた
            break;
          }
          if (value) {
            buffer += textDecoder.decode(value, { stream: true });
            const lines = buffer.split(/\r?\n/);
            // 最後の未完成の行を残す
            buffer = lines.pop();

            for (const line of lines) {
              if (line.trim()) {
                this._handleRawLine(line);
              }
            }
          }
        }
      } catch (readErr) {
        console.error('Serial read chunk error:', readErr);
        // USBが抜かれた等の致命的エラーでなければ少し待機
        if (!this.isConnected) break;
      } finally {
        if (this.reader) {
          try {
            this.reader.releaseLock();
          } catch (e) {}
          this.reader = null;
        }
      }
    }

    // 意図せぬ切断の場合も後処理
    if (this.isConnected) {
      await this.disconnect();
    }
  }

  /**
   * 1行の受信文字列を処理
   * @private
   */
  _handleRawLine(line) {
    const packet = parsePacket(line);
    if (packet && this.onPacketReceived) {
      this.onPacketReceived(packet);
    }
  }

  /**
   * デモモード（シミュレータ）の開始
   */
  startDemo() {
    if (this.isConnected) {
      this.disconnect();
    }
    this.isDemoMode = true;
    this._updateStatus('demo');

    // 1秒間隔でパケットを生成
    this.demoTimer = setInterval(() => {
      this._generateDemoPacket();
    }, 1000);
    // 即時1回目を発行
    this._generateDemoPacket();
  }

  /**
   * デモモードの停止
   */
  stopDemo() {
    if (this.demoTimer) {
      clearInterval(this.demoTimer);
      this.demoTimer = null;
    }
    this.isDemoMode = false;
    this._updateStatus('disconnected');
  }

  /**
   * デモパケットの生成
   * フォーマット: 00.0[m/s],000,+00.0
   * @private
   */
  _generateDemoPacket() {
    const s = this.demoState;

    let speedStr;
    let dirStr;
    let tempStr;

    // 低確率(1/80)でランダムにエラー（99.9）をシミュレート
    if (Math.random() < 0.0125) {
      speedStr = '99.9';
    } else {
      // 風速のランダムウォーク: 0.5〜18.0 m/s 程度
      const deltaSpeed = (Math.random() - 0.48) * 0.8;
      s.speed = Math.max(0.2, Math.min(28.0, s.speed + deltaSpeed));
      speedStr = s.speed.toFixed(1).padStart(4, '0');
    }

    // 風向のランダムウォーク: 0〜359度
    const deltaDir = (Math.random() - 0.5) * 12;
    s.direction = (s.direction + deltaDir + 360) % 360;
    dirStr = Math.round(s.direction).toString().padStart(3, '0');

    // 気温のゆるやかな変動: 18.0〜28.0℃
    const deltaTemp = (Math.random() - 0.5) * 0.1;
    s.temperature = Math.max(10.0, Math.min(35.0, s.temperature + deltaTemp));
    const sign = s.temperature >= 0 ? '+' : '-';
    tempStr = sign + Math.abs(s.temperature).toFixed(1).padStart(4, '0');

    const line = `${speedStr}[m/s],${dirStr},${tempStr}`;
    this._handleRawLine(line);
  }

  /**
   * 状態変化を通知
   * @private
   */
  _updateStatus(status) {
    if (this.onStatusChange) {
      this.onStatusChange(status, {
        isConnected: this.isConnected,
        isDemoMode: this.isDemoMode
      });
    }
  }
}

/**
 * digital-clock.js
 * 24時間表記のデジタル時計コンポーネント
 */

class DigitalClock {
  /**
   * @param {HTMLElement} containerElement
   */
  constructor(containerElement) {
    this.container = containerElement;
    this.timer = null;
    this.render();
    this.start();
  }

  render() {
    this.container.innerHTML = `
      <div class="digital-clock-widget">
        <div class="clock-date" id="clock-date">----/--/-- (---)</div>
        <div class="clock-time" id="clock-time">00:00:00</div>
      </div>
    `;
    this.dateEl = this.container.querySelector('#clock-date');
    this.timeEl = this.container.querySelector('#clock-time');
    this.update();
  }

  start() {
    this.timer = setInterval(() => this.update(), 1000);
  }

  stop() {
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
  }

  update() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');

    const year = now.getFullYear();
    const month = pad(now.getMonth() + 1);
    const date = pad(now.getDate());

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const dayName = days[now.getDay()];

    const hours = pad(now.getHours());
    const minutes = pad(now.getMinutes());
    const seconds = pad(now.getSeconds());

    if (this.dateEl) {
      this.dateEl.textContent = `${year}/${month}/${date} (${dayName})`;
    }
    if (this.timeEl) {
      this.timeEl.textContent = `${hours}:${minutes}:${seconds}`;
    }
  }
}

/**
 * wind-direction-gauge.js
 * リアルタイム風向メーター
 *
 * 仕様:
 * - 中央に方位を表す大きな太い凹四角形型（シェブロン型）の針
 * - 円いっぱいに近く大きく描画
 * - 最短回転アルゴリズムによるなめらかな回転アニメーション
 * - 0度: 北(N), 90度: 東(E), 180度: 南(S), 270度: 西(W)
 * - 計測エラー（99.9m/s）時の警告表示
 */

class WindDirectionGauge {
  /**
   * @param {HTMLElement} containerElement
   */
  constructor(containerElement) {
    this.container = containerElement;
    this.currentAngle = 0; // 累積角度（最短補間用）
    this.isError = false;
    this.direction = 0;
    this.render();
  }

  render() {
    this.container.innerHTML = `
      <div class="gauge-card wind-direction-card">
        <div class="gauge-header">
          <span class="gauge-title">風向 (WIND DIRECTION)</span>
          <span class="gauge-badge" id="dir-error-badge" style="display:none;">ERROR</span>
        </div>
        <div class="gauge-body">
          <svg class="compass-svg" viewBox="0 0 300 300" width="100%" height="100%">
            <defs>
              <!-- 針のグラデーション（通常時） -->
              <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#00f0ff" />
                <stop offset="60%" stop-color="#0088ff" />
                <stop offset="100%" stop-color="#0044aa" />
              </linearGradient>
              <!-- 針のグラデーション（エラー時） -->
              <linearGradient id="needleErrorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ff4444" />
                <stop offset="60%" stop-color="#cc1111" />
                <stop offset="100%" stop-color="#660000" />
              </linearGradient>
              <!-- ドロップシャドウ -->
              <filter id="needleGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.5"/>
              </filter>
            </defs>

            <!-- 外枠サークル -->
            <circle cx="150" cy="150" r="142" class="compass-outer-ring" />
            <circle cx="150" cy="150" r="134" class="compass-inner-ring" />

            <!-- 目盛り線（30度ごと・10度ごと） -->
            <g class="compass-ticks">
              ${this._generateTicks()}
            </g>

            <!-- 方位ラベル -->
            <!-- 主要4方位 (大) -->
            <text x="150" y="32" class="compass-label major-label label-n">N</text>
            <text x="270" y="156" class="compass-label major-label label-e">E</text>
            <text x="150" y="280" class="compass-label major-label label-s">S</text>
            <text x="30" y="156" class="compass-label major-label label-w">W</text>

            <!-- 4主方位 (中) -->
            <text x="232" y="74" class="compass-label minor-label">NE</text>
            <text x="232" y="238" class="compass-label minor-label">SE</text>
            <text x="68" y="238" class="compass-label minor-label">SW</text>
            <text x="68" y="74" class="compass-label minor-label">NW</text>

            <!-- 角度ラベル (0, 90, 180, 270) -->
            <text x="150" y="46" class="compass-deg-label">0°</text>
            <text x="254" y="155" class="compass-deg-label">90°</text>
            <text x="150" y="264" class="compass-deg-label">180°</text>
            <text x="46" y="155" class="compass-deg-label">270°</text>

            <!-- シェブロン型（凹四角形）針 -->
            <!-- 中心 (150, 150) を軸に回転 -->
            <g id="compass-needle-group" style="transform-origin: 150px 150px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);">
              <!-- 凹四角形（シェブロン）: 先端 (150, 24), 右翼端 (215, 230), 凹み底 (150, 190), 左翼端 (85, 230) -->
              <polygon
                id="compass-needle"
                points="150,24 215,230 150,190 85,230"
                fill="url(#needleGrad)"
                stroke="#ffffff"
                stroke-width="2.5"
                filter="url(#needleGlow)"
              />
              <!-- 針の中央分割線（立体感向上） -->
              <polygon
                id="compass-needle-half"
                points="150,24 215,230 150,190"
                fill="rgba(255, 255, 255, 0.2)"
              />
              <!-- 中心ピボット -->
              <circle cx="150" cy="150" r="10" fill="#0b1329" stroke="#00f0ff" stroke-width="2.5" />
              <circle cx="150" cy="150" r="4" fill="#ffffff" />
            </g>
          </svg>
        </div>

        <div class="gauge-footer">
          <div class="gauge-value-display">
            <span class="value-number" id="dir-deg-text">---</span>
            <span class="value-unit">°</span>
            <span class="value-sub" id="dir-name-text">--</span>
          </div>
        </div>
      </div>
    `;

    this.needleGroup = this.container.querySelector('#compass-needle-group');
    this.needlePolygon = this.container.querySelector('#compass-needle');
    this.degText = this.container.querySelector('#dir-deg-text');
    this.nameText = this.container.querySelector('#dir-name-text');
    this.errorBadge = this.container.querySelector('#dir-error-badge');
  }

  /**
   * 目盛り線を生成（360度、10度刻み・30度刻み）
   * @private
   */
  _generateTicks() {
    const ticks = [];
    const cx = 150;
    const cy = 150;
    const rOuter = 134;

    for (let deg = 0; deg < 360; deg += 10) {
      const isMajor = deg % 30 === 0;
      const tickLength = isMajor ? 10 : 5;
      const rInner = rOuter - tickLength;
      const rad = ((deg - 90) * Math.PI) / 180;

      const x1 = (cx + rOuter * Math.cos(rad)).toFixed(1);
      const y1 = (cy + rOuter * Math.sin(rad)).toFixed(1);
      const x2 = (cx + rInner * Math.cos(rad)).toFixed(1);
      const y2 = (cy + rInner * Math.sin(rad)).toFixed(1);

      ticks.push(
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMajor ? '#617d98' : '#334e68'}" stroke-width="${isMajor ? 2 : 1}" />`
      );
    }
    return ticks.join('\n');
  }

  /**
   * 角度から16方位名称を取得
   * @param {number} deg
   * @returns {string}
   */
  _degToCompassName(deg) {
    const directions = [
      '北 (N)', '北北東 (NNE)', '北東 (NE)', '東北東 (ENE)',
      '東 (E)', '東南東 (ESE)', '南東 (SE)', '南南東 (SSE)',
      '南 (S)', '南南西 (SSW)', '南西 (SW)', '西南西 (WSW)',
      '西 (W)', '西北西 (WNW)', '北西 (NW)', '北北西 (NNW)'
    ];
    const index = Math.round((deg % 360) / 22.5) % 16;
    return directions[index];
  }

  /**
   * 風向データを更新
   * @param {object} packet
   */
  update(packet) {
    if (!packet || !packet.isValid) return;

    this.isError = packet.isError;
    this.direction = packet.direction;

    if (this.isError) {
      // エラー時の表示
      if (this.errorBadge) this.errorBadge.style.display = 'inline-block';
      if (this.needlePolygon) {
        this.needlePolygon.setAttribute('fill', 'url(#needleErrorGrad)');
        this.needlePolygon.setAttribute('stroke', '#ff6666');
      }
      if (this.degText) {
        this.degText.textContent = 'ERR';
        this.degText.classList.add('error-text');
      }
      if (this.nameText) this.nameText.textContent = '計測エラー';
      return;
    }

    // 正常時
    if (this.errorBadge) this.errorBadge.style.display = 'none';
    if (this.needlePolygon) {
      this.needlePolygon.setAttribute('fill', 'url(#needleGrad)');
      this.needlePolygon.setAttribute('stroke', '#ffffff');
    }
    if (this.degText) {
      this.degText.textContent = String(this.direction).padStart(3, '0');
      this.degText.classList.remove('error-text');
    }
    if (this.nameText) {
      this.nameText.textContent = this._degToCompassName(this.direction);
    }

    // 最短角度でなめらかに回転
    const targetDeg = this.direction;
    const currentModulo = ((this.currentAngle % 360) + 360) % 360;
    let diff = (targetDeg - currentModulo + 540) % 360 - 180;
    this.currentAngle += diff;

    if (this.needleGroup) {
      this.needleGroup.style.transform = `rotate(${this.currentAngle}deg)`;
    }
  }
}

/**
 * wind-speed-gauge.js
 * リアルタイム風速メーター
 *
 * 仕様:
 * - リアルタイム表示
 * - 計測エラー (99.9m/s) 時のエラー警告表示
 * - 時間軸グラフの風速スケール（5, 10, 20, 30 m/s）と連動してスケールを動的変更
 */

class WindSpeedGauge {
  /**
   * @param {HTMLElement} containerElement
   * @param {number} [initialMaxScale=10]
   */
  constructor(containerElement, initialMaxScale = 10) {
    this.container = containerElement;
    this.maxScale = initialMaxScale; // 5, 10, 20, 30
    this.currentSpeed = 0.0;
    this.isError = false;
    this.render();
  }

  render() {
    this.container.innerHTML = `
      <div class="gauge-card wind-speed-card">
        <div class="gauge-header">
          <span class="gauge-title">風速 (WIND SPEED)</span>
          <span class="gauge-badge" id="speed-error-badge" style="display:none;">ERROR</span>
        </div>
        <div class="gauge-body">
          <svg class="speed-svg" viewBox="0 0 300 240" width="100%" height="100%">
            <defs>
              <!-- 速度バーの4セグメント固定グラデーション（円弧の接線方向に沿って固定） -->
              <linearGradient id="speedGrad1" x1="55" y1="225" x2="55" y2="115" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00f0ff" />
                <stop offset="100%" stop-color="#10b981" />
              </linearGradient>
              <linearGradient id="speedGrad2" x1="55" y1="115" x2="150" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#22c55e" />
              </linearGradient>
              <linearGradient id="speedGrad3" x1="150" y1="60" x2="245" y2="115" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#22c55e" />
                <stop offset="100%" stop-color="#eab308" />
              </linearGradient>
              <linearGradient id="speedGrad4" x1="245" y1="115" x2="245" y2="225" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#eab308" />
                <stop offset="100%" stop-color="#ef4444" />
              </linearGradient>
              <linearGradient id="speedErrorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ef4444" />
                <stop offset="100%" stop-color="#991b1b" />
              </linearGradient>

              <!-- マスク: 針先端までの円弧のみを表示 -->
              <mask id="speedArcMask">
                <path id="speed-mask-arc" class="speed-arc-mask" />
              </mask>
            </defs>

            <!-- 背景アークトラック (開始 -210度, 終了 30度 = 240度の円弧) -->
            <path id="speed-track-bg" class="speed-arc-track" />

            <!-- プログレスバー（固定グラデーション + マスク制御） -->
            <g id="speed-track-fill-group" mask="url(#speedArcMask)" style="opacity: 0; transition: opacity 0.2s ease;">
              <path id="speed-seg-1" class="speed-arc-seg" stroke="url(#speedGrad1)" />
              <path id="speed-seg-2" class="speed-arc-seg" stroke="url(#speedGrad2)" />
              <path id="speed-seg-3" class="speed-arc-seg" stroke="url(#speedGrad3)" />
              <path id="speed-seg-4" class="speed-arc-seg" stroke="url(#speedGrad4)" />
            </g>

            <!-- エラートラック（99.9m/s エラー時用） -->
            <path id="speed-track-error" class="speed-arc-error" style="display: none;" />

            <!-- 目盛り線と数値ラベル -->
            <g id="speed-ticks"></g>

            <!-- 針 -->
            <g id="speed-needle-group" style="transform-origin: 150px 170px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);">
              <polygon points="146,170 154,170 151,45 149,45" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
              <circle cx="150" cy="170" r="8" fill="#1e293b" stroke="#00f0ff" stroke-width="2.5" />
            </g>

            <!-- スケール表示 -->
            <text x="150" y="210" class="speed-scale-indicator" id="speed-scale-text">SCALE: 0 - 10 m/s</text>
          </svg>
        </div>

        <div class="gauge-footer">
          <div class="gauge-value-display">
            <span class="value-number" id="speed-val-text">--.-</span>
            <span class="value-unit">m/s</span>
          </div>
        </div>
      </div>
    `;

    this.trackBg = this.container.querySelector('#speed-track-bg');
    this.maskArc = this.container.querySelector('#speed-mask-arc');
    this.fillGroup = this.container.querySelector('#speed-track-fill-group');
    this.seg1 = this.container.querySelector('#speed-seg-1');
    this.seg2 = this.container.querySelector('#speed-seg-2');
    this.seg3 = this.container.querySelector('#speed-seg-3');
    this.seg4 = this.container.querySelector('#speed-seg-4');
    this.trackError = this.container.querySelector('#speed-track-error');
    this.ticksGroup = this.container.querySelector('#speed-ticks');
    this.needleGroup = this.container.querySelector('#speed-needle-group');
    this.scaleText = this.container.querySelector('#speed-scale-text');
    this.valText = this.container.querySelector('#speed-val-text');
    this.errorBadge = this.container.querySelector('#speed-error-badge');

    this._setupArc();
    this._drawTicks();
  }

  /**
   * 円弧のパス（中心: 150, 170, 半径: 110, 開始角: -210°, 終了角: 30°）
   * @private
   */
  _polarToCartesian(cx, cy, r, angleDeg) {
    const rad = (angleDeg * Math.PI) / 180;
    return {
      x: cx + r * Math.cos(rad),
      y: cy + r * Math.sin(rad)
    };
  }

  _describeArc(cx, cy, r, startAngle, endAngle) {
    const start = this._polarToCartesian(cx, cy, r, startAngle);
    const end = this._polarToCartesian(cx, cy, r, endAngle);
    const arcSweep = endAngle - startAngle <= 180 ? '0' : '1';
    return `M ${start.x} ${start.y} A ${r} ${r} 0 ${arcSweep} 1 ${end.x} ${end.y}`;
  }

  _setupArc() {
    const fullArc = this._describeArc(150, 170, 110, -210, 30);
    this.trackBg.setAttribute('d', fullArc);

    // 4セグメント（各60度）のパスを設定してグラデーションを全域固定
    this.seg1.setAttribute('d', this._describeArc(150, 170, 110, -210, -150));
    this.seg2.setAttribute('d', this._describeArc(150, 170, 110, -150, -90));
    this.seg3.setAttribute('d', this._describeArc(150, 170, 110, -90, -30));
    this.seg4.setAttribute('d', this._describeArc(150, 170, 110, -30, 30));

    // マスク円弧の初期設定
    this.maskArc.setAttribute('d', fullArc);
    this.arcLength = (this.maskArc.getTotalLength && this.maskArc.getTotalLength()) || 460.77;
    this.maskArc.style.strokeDasharray = `${this.arcLength} ${this.arcLength}`;
    this.maskArc.style.strokeDashoffset = `${this.arcLength}`;

    // エラートラック
    if (this.trackError) {
      this.trackError.setAttribute('d', fullArc);
      this.trackError.setAttribute('stroke', 'url(#speedErrorGrad)');
    }
  }

  /**
   * 目盛り線と目盛り数値を描画
   * @private
   */
  _drawTicks() {
    const cx = 150;
    const cy = 170;
    const rOuter = 125;
    const rInnerMajor = 115;
    const rInnerMinor = 119;
    const rText = 98;

    const startAngle = -210;
    const totalAngle = 240; // -210 to 30

    const max = this.maxScale;
    // ステップ数: 5m/sなら5分割, 10m/sなら10分割, 20m/sなら10分割(2刻み), 30m/sなら6分割(5刻み)
    let majorSteps = 10;
    if (max === 5) majorSteps = 5;
    if (max === 20) majorSteps = 10;
    if (max === 30) majorSteps = 6;

    let html = '';

    for (let i = 0; i <= majorSteps; i++) {
      const fraction = i / majorSteps;
      const angle = startAngle + fraction * totalAngle;
      const val = (max * fraction).toFixed(max === 5 ? 0 : 0);

      const pOuter = this._polarToCartesian(cx, cy, rOuter, angle);
      const pInner = this._polarToCartesian(cx, cy, rInnerMajor, angle);
      const pText = this._polarToCartesian(cx, cy, rText, angle);

      html += `<line x1="${pOuter.x.toFixed(1)}" y1="${pOuter.y.toFixed(1)}" x2="${pInner.x.toFixed(1)}" y2="${pInner.y.toFixed(1)}" stroke="#64748b" stroke-width="2" />`;
      html += `<text x="${pText.x.toFixed(1)}" y="${(pText.y + 4).toFixed(1)}" text-anchor="middle" class="speed-tick-text">${val}</text>`;
    }

    this.ticksGroup.innerHTML = html;
    if (this.scaleText) {
      this.scaleText.textContent = `SCALE: 0 - ${this.maxScale} m/s`;
    }
  }

  /**
   * スケール上限（5, 10, 20, 30）を変更する
   * @param {number} newMax
   */
  setScale(newMax) {
    if (newMax !== this.maxScale) {
      this.maxScale = newMax;
      this._drawTicks();
      this._updateVisuals();
    }
  }

  /**
   * 風速データを更新
   * @param {object} packet
   */
  update(packet) {
    if (!packet || !packet.isValid) return;

    this.isError = packet.isError;
    this.currentSpeed = packet.speed;

    this._updateVisuals();
  }

  _updateVisuals() {
    if (this.isError) {
      if (this.errorBadge) this.errorBadge.style.display = 'inline-block';
      if (this.valText) {
        this.valText.textContent = '99.9';
        this.valText.classList.add('error-text');
      }
      if (this.fillGroup) {
        this.fillGroup.style.opacity = '0';
      }
      if (this.trackError) {
        this.trackError.style.display = 'block';
      }
      if (this.needleGroup) {
        this.needleGroup.style.transform = `rotate(30deg)`;
      }
      return;
    }

    if (this.errorBadge) this.errorBadge.style.display = 'none';
    if (this.trackError) this.trackError.style.display = 'none';

    if (this.valText) {
      this.valText.textContent = this.currentSpeed.toFixed(1);
      this.valText.classList.remove('error-text');
    }

    // 速度比率 (0.0 〜 1.0)
    const ratio = Math.max(0, Math.min(1.0, this.currentSpeed / this.maxScale));
    const startAngle = -210;
    const currentAngle = startAngle + ratio * 240;

    // マスクによって針先端までのみ固定グラデーションを表示
    if (this.maskArc && this.fillGroup) {
      if (ratio > 0.005) {
        const offset = this.arcLength * (1 - ratio);
        this.maskArc.style.strokeDashoffset = `${offset}`;
        this.fillGroup.style.opacity = '1';
      } else {
        this.maskArc.style.strokeDashoffset = `${this.arcLength}`;
        this.fillGroup.style.opacity = '0';
      }
    }

    if (this.needleGroup) {
      // 針の初期位置は上(0度)。-210度は上から-120度
      // 針角度 = currentAngle + 90度
      const needleDeg = currentAngle + 90;
      this.needleGroup.style.transform = `rotate(${needleDeg}deg)`;
    }
  }
}

/**
 * temperature-gauge.js
 * リアルタイム丸形温度計コンポーネント
 *
 * 仕様:
 * - 丸形メーター（ダイアル型）デザイン
 * - 0℃（氷点）と 25℃（適温）の位置がひと目でわかるハイライト表示
 * - 時間軸グラフと連動した温度スケール切替（-10〜+50℃ / -20〜+65℃）
 * - なめらかな針・アークアニメーション
 */

class TemperatureGauge {
  /**
   * @param {HTMLElement} containerElement
   * @param {string} [initialScale='default'] - 'default' (-10〜+50℃) または 'max' (-20〜+65℃)
   */
  constructor(containerElement, initialScale = 'default') {
    this.container = containerElement;
    this.scaleKey = initialScale;
    this.minTemp = initialScale === 'max' ? -20 : -10;
    this.maxTemp = initialScale === 'max' ? 65 : 50;
    this.currentTempC = null;
    this.render();
  }

  render() {
    this.container.innerHTML = `
      <div class="gauge-card temperature-card">
        <div class="gauge-header">
          <span class="gauge-title">気温 (TEMPERATURE)</span>
        </div>
        <div class="gauge-body">
          <svg class="temp-svg" viewBox="0 0 300 240" width="100%" height="100%">
            <defs>
              <!-- 温度バーの4セグメント固定グラデーション（低温青〜水色〜適温緑〜黄〜赤） -->
              <linearGradient id="tempGrad1" x1="55" y1="225" x2="55" y2="115" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
              <linearGradient id="tempGrad2" x1="55" y1="115" x2="150" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#22c55e" />
              </linearGradient>
              <linearGradient id="tempGrad3" x1="150" y1="60" x2="245" y2="115" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#22c55e" />
                <stop offset="100%" stop-color="#eab308" />
              </linearGradient>
              <linearGradient id="tempGrad4" x1="245" y1="115" x2="245" y2="225" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#eab308" />
                <stop offset="100%" stop-color="#ef4444" />
              </linearGradient>

              <!-- マスク: 針先端までの円弧のみを表示 -->
              <mask id="tempArcMask">
                <path id="temp-mask-arc" class="temp-arc-mask" />
              </mask>
            </defs>

            <!-- 背景アークトラック (開始 -210度, 終了 30度 = 240度の円弧) -->
            <path id="temp-track-bg" class="temp-arc-track" />

            <!-- プログレスバー（固定グラデーション + マスク制御） -->
            <g id="temp-track-fill-group" mask="url(#tempArcMask)" style="opacity: 0; transition: opacity 0.2s ease;">
              <path id="temp-seg-1" class="temp-arc-seg" stroke="url(#tempGrad1)" />
              <path id="temp-seg-2" class="temp-arc-seg" stroke="url(#tempGrad2)" />
              <path id="temp-seg-3" class="temp-arc-seg" stroke="url(#tempGrad3)" />
              <path id="temp-seg-4" class="temp-arc-seg" stroke="url(#tempGrad4)" />
            </g>

            <!-- 目盛り線と数値ラベル・ハイライト標識 -->
            <g id="temp-ticks"></g>

            <!-- 針 -->
            <g id="temp-needle-group" style="transform-origin: 150px 170px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);">
              <polygon points="146,170 154,170 151,45 149,45" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
              <circle cx="150" cy="170" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
            </g>

            <!-- スケール表示 -->
            <text x="150" y="210" class="temp-scale-indicator" id="temp-scale-text">SCALE: -10 ~ +50 ℃</text>
          </svg>
        </div>

        <div class="gauge-footer">
          <div class="gauge-value-display">
            <span class="value-number" id="temp-c-text">--.-</span>
            <span class="value-unit">℃</span>
          </div>
        </div>
      </div>
    `;

    this.trackBg = this.container.querySelector('#temp-track-bg');
    this.maskArc = this.container.querySelector('#temp-mask-arc');
    this.fillGroup = this.container.querySelector('#temp-track-fill-group');
    this.seg1 = this.container.querySelector('#temp-seg-1');
    this.seg2 = this.container.querySelector('#temp-seg-2');
    this.seg3 = this.container.querySelector('#temp-seg-3');
    this.seg4 = this.container.querySelector('#temp-seg-4');
    this.ticksGroup = this.container.querySelector('#temp-ticks');
    this.needleGroup = this.container.querySelector('#temp-needle-group');
    this.scaleText = this.container.querySelector('#temp-scale-text');
    this.cText = this.container.querySelector('#temp-c-text');

    this._setupArc();
    this._drawTicks();
  }

  /**
   * 極座標から直交座標への変換
   * @private
   */
  _polarToCartesian(cx, cy, r, angleDeg) {
    const rad = (angleDeg * Math.PI) / 180;
    return {
      x: cx + r * Math.cos(rad),
      y: cy + r * Math.sin(rad)
    };
  }

  /**
   * 円弧パス文字列生成
   * @private
   */
  _describeArc(cx, cy, r, startAngle, endAngle) {
    const start = this._polarToCartesian(cx, cy, r, startAngle);
    const end = this._polarToCartesian(cx, cy, r, endAngle);
    const arcSweep = endAngle - startAngle <= 180 ? '0' : '1';
    return `M ${start.x} ${start.y} A ${r} ${r} 0 ${arcSweep} 1 ${end.x} ${end.y}`;
  }

  _setupArc() {
    const fullArc = this._describeArc(150, 170, 110, -210, 30);
    this.trackBg.setAttribute('d', fullArc);

    // 4セグメント（各60度）のパスを設定してグラデーションを全域固定
    this.seg1.setAttribute('d', this._describeArc(150, 170, 110, -210, -150));
    this.seg2.setAttribute('d', this._describeArc(150, 170, 110, -150, -90));
    this.seg3.setAttribute('d', this._describeArc(150, 170, 110, -90, -30));
    this.seg4.setAttribute('d', this._describeArc(150, 170, 110, -30, 30));

    // マスク円弧の初期設定
    this.maskArc.setAttribute('d', fullArc);
    this.arcLength = (this.maskArc.getTotalLength && this.maskArc.getTotalLength()) || 460.77;
    this.maskArc.style.strokeDasharray = `${this.arcLength} ${this.arcLength}`;
    this.maskArc.style.strokeDashoffset = `${this.arcLength}`;
  }

  /**
   * 温度（℃）から角度（-210°〜+30°）を算出
   * @private
   */
  _tempToAngle(temp) {
    const ratio = (temp - this.minTemp) / (this.maxTemp - this.minTemp);
    return -210 + ratio * 240;
  }

  /**
   * 目盛り線、数値、0℃/25℃ハイライトを描画
   * @private
   */
  _drawTicks() {
    const cx = 150;
    const cy = 170;
    const rOuter = 125;
    const rInnerMajor = 115;
    const rInnerMinor = 119;
    const rText = 98;
    const rHighlightText = 74;

    let html = '';

    // 目盛りの刻み定義
    // default: -10〜+50 (10刻み: -10, 0, 10, 20, 30, 40, 50, および 25)
    // max: -20〜+65 (10刻み: -20, -10, 0, 10, 20, 30, 40, 50, 60, 65, および 25)
    const tickValues = [];
    const min = this.minTemp;
    const max = this.maxTemp;

    for (let t = Math.ceil(min / 10) * 10; t <= max; t += 10) {
      tickValues.push(t);
    }
    if (max % 10 !== 0 && !tickValues.includes(max)) {
      tickValues.push(max);
    }
    if (min % 10 !== 0 && !tickValues.includes(min)) {
      tickValues.unshift(min);
    }

    // 5刻みの小目盛り
    const minorValues = [];
    for (let t = Math.ceil(min / 5) * 5; t <= max; t += 5) {
      if (!tickValues.includes(t) && t !== 25) {
        minorValues.push(t);
      }
    }

    // 小目盛りの描画
    minorValues.forEach((val) => {
      const angle = this._tempToAngle(val);
      const pOuter = this._polarToCartesian(cx, cy, rOuter - 3, angle);
      const pInner = this._polarToCartesian(cx, cy, rInnerMinor, angle);
      html += `<line x1="${pOuter.x.toFixed(1)}" y1="${pOuter.y.toFixed(1)}" x2="${pInner.x.toFixed(1)}" y2="${pInner.y.toFixed(1)}" stroke="#475569" stroke-width="1.2" />`;
    });

    // 主目盛りと数値の描画
    tickValues.forEach((val) => {
      const angle = this._tempToAngle(val);
      const isFreeze = val === 0;
      const strokeColor = isFreeze ? '#38bdf8' : '#64748b';
      const strokeW = isFreeze ? '2.5' : '2';
      const textColor = isFreeze ? 'var(--accent-blue)' : 'var(--text-secondary)';
      const fontWeight = isFreeze ? 'bold' : 'normal';

      const pOuter = this._polarToCartesian(cx, cy, rOuter, angle);
      const pInner = this._polarToCartesian(cx, cy, rInnerMajor, angle);
      const pText = this._polarToCartesian(cx, cy, rText, angle);

      html += `<line x1="${pOuter.x.toFixed(1)}" y1="${pOuter.y.toFixed(1)}" x2="${pInner.x.toFixed(1)}" y2="${pInner.y.toFixed(1)}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
      html += `<text x="${pText.x.toFixed(1)}" y="${(pText.y + 4).toFixed(1)}" text-anchor="middle" class="temp-tick-text" style="fill: ${textColor}; font-weight: ${fontWeight};">${val}</text>`;
    });

    // 25℃（適温）の特別目盛り
    if (min <= 25 && 25 <= max) {
      const angle25 = this._tempToAngle(25);
      const pOuter25 = this._polarToCartesian(cx, cy, rOuter, angle25);
      const pInner25 = this._polarToCartesian(cx, cy, rInnerMajor, angle25);
      const pText25 = this._polarToCartesian(cx, cy, rText, angle25);

      html += `<line x1="${pOuter25.x.toFixed(1)}" y1="${pOuter25.y.toFixed(1)}" x2="${pInner25.x.toFixed(1)}" y2="${pInner25.y.toFixed(1)}" stroke="#22c55e" stroke-width="2.5" />`;
      html += `<text x="${pText25.x.toFixed(1)}" y="${(pText25.y + 4).toFixed(1)}" text-anchor="middle" class="temp-tick-text" style="fill: var(--accent-green); font-weight: bold;">25</text>`;

      // 25℃(適温) テキストラベル
      const pLabel25 = this._polarToCartesian(cx, cy, rHighlightText, angle25);
      html += `
        <g class="temp-highlight-mark">
          <text x="${pLabel25.x.toFixed(1)}" y="${(pLabel25.y + 3).toFixed(1)}" text-anchor="middle" fill="#22c55e" font-size="9.5" font-weight="700">25℃(適温)</text>
        </g>
      `;
    }

    // 0℃（氷点）の特別テキストラベル
    if (min <= 0 && 0 <= max) {
      const angle0 = this._tempToAngle(0);
      const pLabel0 = this._polarToCartesian(cx, cy, rHighlightText, angle0);
      html += `
        <g class="temp-highlight-mark">
          <text x="${pLabel0.x.toFixed(1)}" y="${(pLabel0.y + 3).toFixed(1)}" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">0℃(氷点)</text>
        </g>
      `;
    }

    this.ticksGroup.innerHTML = html;
    if (this.scaleText) {
      const signMin = this.minTemp >= 0 ? '+' : '';
      const signMax = this.maxTemp >= 0 ? '+' : '';
      this.scaleText.textContent = `SCALE: ${signMin}${this.minTemp} ~ ${signMax}${this.maxTemp} ℃`;
    }
  }

  /**
   * 温度スケール（'default': -10〜+50℃ / 'max': -20〜+65℃）を変更
   * @param {string} scaleKey
   */
  setScale(scaleKey) {
    if (scaleKey === 'max') {
      this.minTemp = -20;
      this.maxTemp = 65;
      this.scaleKey = 'max';
    } else {
      this.minTemp = -10;
      this.maxTemp = 50;
      this.scaleKey = 'default';
    }
    this._drawTicks();
    this._updateVisuals();
  }

  /**
   * 温度データを更新
   * @param {object} packet
   */
  update(packet) {
    if (!packet || !packet.isValid) return;

    this.currentTempC = packet.temperature;
    this._updateVisuals();
  }

  /**
   * 表示（針・アーク・数値）を更新
   * @private
   */
  _updateVisuals() {
    if (this.currentTempC === null || this.currentTempC === undefined) return;

    const sign = this.currentTempC >= 0 ? '+' : '';

    if (this.cText) {
      this.cText.textContent = `${sign}${this.currentTempC.toFixed(1)}`;
    }

    // スケール内の比率 (0.0 〜 1.0)
    const ratio = Math.max(0, Math.min(1.0, (this.currentTempC - this.minTemp) / (this.maxTemp - this.minTemp)));
    const startAngle = -210;
    const currentAngle = startAngle + ratio * 240;

    // マスクによって針先端まで固定グラデーションを表示
    if (this.maskArc && this.fillGroup) {
      if (ratio > 0.005) {
        const offset = this.arcLength * (1 - ratio);
        this.maskArc.style.strokeDashoffset = `${offset}`;
        this.fillGroup.style.opacity = '1';
      } else {
        this.maskArc.style.strokeDashoffset = `${this.arcLength}`;
        this.fillGroup.style.opacity = '0';
      }
    }

    // 針の回転 (針初期位置は上(0度)、currentAngle + 90度で回転)
    if (this.needleGroup) {
      const needleDeg = currentAngle + 90;
      this.needleGroup.style.transform = `rotate(${needleDeg}deg)`;
    }
  }
}
